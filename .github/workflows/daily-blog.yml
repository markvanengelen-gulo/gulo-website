name: Daily Blog Post

on:
  schedule:
    - cron: '0 12 * * 1,3,5'  # Mon/Wed/Fri at 12pm UTC (8am EDT)
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic --break-system-packages

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_post.py

      - name: Commit and push post
        run: |
          git config user.name "Gulo Blog Bot"
          git config user.email "bot@gulo.ai"
          git add .
          git diff --staged --quiet || git commit -m "Auto blog post $(date +'%Y-%m-%d')"
          git push
